name: Atualizar EPG FreeCast

on:
  schedule:
    # Roda todos os dias às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permite que você clique num botão para rodar manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do seu repositório na máquina virtual
    - name: Checkout do código
      uses: actions/checkout@v4

    # 2. Instala o Python na máquina virtual
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instala as dependências necessárias (requests)
    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Executa o script que coleta o EPG e gera o XML
    - name: Rodar Gerador XMLTV
      run: python ExtrairGerar.py
      env:
        FREECAST_TOKEN: ${{ secrets.FREECAST_TOKEN }}

    # 5. Salva o arquivo gerado de volta no seu GitHub
    - name: Commit e Push do arquivo XMLTV
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add freecast_epg.xml
        # Só faz o commit se houver alterações no arquivo para evitar erros
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto: EPG Atualizado ✅ [skip ci]"
        git push
